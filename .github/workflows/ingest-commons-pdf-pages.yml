name: Ingest Commons PDF page range

on:
  workflow_dispatch:
    inputs:
      source_url: {description: Direct Wikimedia Commons PDF URL, required: true, type: string}
      start_page: {description: First one-based PDF page, required: true, type: number}
      end_page: {description: Last one-based PDF page, required: true, type: number}
      target_path: {description: Existing scan directory below scans/, required: true, type: string}
      expected_count: {description: Expected number of JPEG images, required: true, type: number}
      scope_manifest: {description: Exact canonical page range(s) covered, required: true, type: string}
      greek_sample_evidence: {description: Visual samples inside every segment explicitly confirming Greek, required: true, type: string}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /scripts/
            /${{ inputs.target_path }}/*
            !/${{ inputs.target_path }}/images/
      - name: Install PDF image renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Require scoped Greek visual evidence
        env:
          SCOPE_MANIFEST: ${{ inputs.scope_manifest }}
          GREEK_SAMPLE_EVIDENCE: ${{ inputs.greek_sample_evidence }}
        run: scripts/validate_greek_ingest_evidence.sh
      - name: Download PDF and extract selected pages
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          START_PAGE: ${{ inputs.start_page }}
          END_PAGE: ${{ inputs.end_page }}
          TARGET_PATH: ${{ inputs.target_path }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: scripts/remote_ingest_commons_pdf_pages.sh
      - name: Upload verified images to Hugging Face and clear runner copy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          pip install --disable-pip-version-check --quiet "huggingface_hub[hf_xet]>=1.1"
          python scripts/upload_scan_root_to_hf.py "$TARGET_PATH"
      - name: Commit and push with conflict retry
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse "$TARGET_PATH"
          git commit -m "Register selected Commons PDF pages on HF"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
