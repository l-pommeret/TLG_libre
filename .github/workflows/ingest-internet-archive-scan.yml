name: Ingest Internet Archive scan

on:
  workflow_dispatch:
    inputs:
      ia_identifier:
        description: Internet Archive identifier
        required: true
        type: string
      image_file:
        description: Exact JP2/TIFF ZIP filename
        required: true
        type: string
      target_path:
        description: Existing scan directory below scans/
        required: true
        type: string
      expected_sha1:
        description: SHA-1 published by Internet Archive
        required: true
        type: string
      expected_count:
        description: Expected number of image files
        required: true
        type: number
      scope_manifest:
        description: Why the entire archive is canonical Greek scope
        required: true
        type: string
      greek_sample_evidence:
        description: Must document first middle and last Greek samples
        required: true
        type: string
      whole_volume_greek_verified:
        description: Confirm every volume section is in Greek canonical scope
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /scripts/
            /${{ inputs.target_path }}/*
            !/${{ inputs.target_path }}/images/
      - name: Require whole-volume Greek visual evidence
        env:
          SCOPE_MANIFEST: ${{ inputs.scope_manifest }}
          GREEK_SAMPLE_EVIDENCE: ${{ inputs.greek_sample_evidence }}
          WHOLE_VOLUME_MODE: "true"
          WHOLE_VOLUME_GREEK_VERIFIED: ${{ inputs.whole_volume_greek_verified }}
        run: scripts/validate_greek_ingest_evidence.sh
      - name: Download, verify, and extract source images
        env:
          IA_IDENTIFIER: ${{ inputs.ia_identifier }}
          IMAGE_FILE: ${{ inputs.image_file }}
          TARGET_PATH: ${{ inputs.target_path }}
          EXPECTED_SHA1: ${{ inputs.expected_sha1 }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: scripts/remote_ingest_ia.sh
      - name: Upload verified images to Hugging Face and clear runner copy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          pip install --disable-pip-version-check --quiet "huggingface_hub[hf_xet]>=1.1"
          python scripts/upload_scan_root_to_hf.py "$TARGET_PATH"
      - name: Commit and push with conflict retry
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          IA_IDENTIFIER: ${{ inputs.ia_identifier }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse "$TARGET_PATH"
          git commit -m "Register HF scan archive from $IA_IDENTIFIER"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
