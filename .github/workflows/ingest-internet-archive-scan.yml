name: Ingest Internet Archive scan

on:
  workflow_dispatch:
    inputs:
      ia_identifier:
        description: Internet Archive identifier
        required: true
        type: string
      image_file:
        description: Exact JP2/TIFF ZIP filename
        required: true
        type: string
      target_path:
        description: Existing scan directory below scans/
        required: true
        type: string
      expected_sha1:
        description: SHA-1 published by Internet Archive
        required: true
        type: string
      expected_count:
        description: Expected number of image files
        required: true
        type: number

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /scripts/
            /${{ inputs.target_path }}/*
            !/${{ inputs.target_path }}/images/
      - name: Download, verify, and extract source images
        env:
          IA_IDENTIFIER: ${{ inputs.ia_identifier }}
          IMAGE_FILE: ${{ inputs.image_file }}
          TARGET_PATH: ${{ inputs.target_path }}
          EXPECTED_SHA1: ${{ inputs.expected_sha1 }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: scripts/remote_ingest_ia.sh
      - name: Commit and push with conflict retry
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          IA_IDENTIFIER: ${{ inputs.ia_identifier }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse "$TARGET_PATH"
          git commit -m "Store scan images from $IA_IDENTIFIER"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
