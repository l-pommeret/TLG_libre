name: Quarantine unverified scan images

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: Existing scan directory below scans/
        required: true
        type: string
      confirmation:
        description: Type REMOVE_UNVERIFIED_IMAGES
        required: true
        type: string

permissions:
  contents: write

jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: ${{ inputs.target_path }}
      - name: Remove images lacking segment-level Greek evidence
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = REMOVE_UNVERIFIED_IMAGES
          case "$TARGET_PATH" in scans/*) ;; *) exit 2 ;; esac
          test -d "$TARGET_PATH/images"
          find "$TARGET_PATH/images" -type f -delete
          rmdir "$TARGET_PATH/images"
          rm -f "$TARGET_PATH/SHA1SUMS"
      - name: Commit and push with conflict retry
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A "$TARGET_PATH"
          git commit -m "Quarantine unverified scan images"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
